<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Noticias · Viento Norte</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://vientonorte.io/noticias/" />
    <meta http-equiv="refresh" content="0;url=../noticias/" />
    <script>
      // /news/ salió del canon (S42 v3): reemplazo a /noticias/ conservando query y hash (UTM).
      // Ruta relativa: funciona igual con base "/" (prod) y "/qa/" (QA).
      (function () {
        var target = new URL("../noticias/", location.href);
        target.search = location.search;
        target.hash = location.hash;
        location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <p>Esta página se mudó a <a href="../noticias/">Noticias</a>.</p>
  </body>
</html>
