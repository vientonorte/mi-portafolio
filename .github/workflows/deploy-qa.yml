name: Deploy QA

# Publica SPA de prueba en https://vientonorte.io/qa/ (multi-device, noindex).
# Tras DNS CNAME qa → GitHub Pages, se puede mapear qa.vientonorte.io (ver docs/QA-ENV.md).
on:
  push:
    branches:
      - "preview/**"
      - qa
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: qa-pages
  cancel-in-progress: true

jobs:
  build-and-publish-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@vientonorte"
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - run: npm run sync:images

      - name: Build QA SPA (base /qa/)
        run: npx vite build
        env:
          VITE_BASE: /qa/
          VITE_APP_ENV: qa
          VITE_GA_MEASUREMENT_ID: ""
          VITE_GTM_ID: ""

      - name: Guard — dist QA sin placeholders ni enlaces a /#/news o /news/
        run: bash scripts/check-dist-no-placeholders.sh

      - name: SPA fallback + noindex
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          # noindex:begin — robots noindex en TODO dist/**/*.html (idempotente).
          # Normaliza cualquier meta robots existente y agrega una si falta.
          find dist -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's#<meta\s+name="robots"\s+content="[^"]*"\s*/?>#<meta name="robots" content="noindex, nofollow" />#gi' "$f"
            if ! grep -q '<meta name="robots" content="noindex, nofollow" />' "$f"; then
              perl -0pi -e 's#<head(\s[^>]*)?>#<head$1>\n    <meta name="robots" content="noindex, nofollow" />#i' "$f"
            fi
          done
          missing=$(find dist -type f -name '*.html' -exec grep -L 'content="noindex, nofollow"' {} + | grep -v 'google[0-9a-f]*\.html$' || true)
          if [ -n "$missing" ]; then
            echo "HTML sin noindex en QA:" >&2
            echo "$missing" >&2
            exit 1
          fi
          # noindex:end
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Publish to hub /qa/
        env:
          HUB_TOKEN: ${{ secrets.VN_HUB_DEPLOY_TOKEN || secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "vn-deploy-qa"
          git config --global user.email "deploy@vientonorte.io"
          rm -rf /tmp/vn-hub-qa
          git clone --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/vientonorte/vientonorte.github.io.git" /tmp/vn-hub-qa
          cd /tmp/vn-hub-qa
          rm -rf qa
          mkdir -p qa
          cp -R "$GITHUB_WORKSPACE/dist/." qa/
          # Marker for ops
          echo "qa.vientonorte.io (optional CNAME) → serve /qa/ or CF redirect" > qa/README-QA.txt
          git add -A qa
          if git diff --cached --quiet; then
            echo "No QA hub changes"
          else
            git commit -m "deploy(qa): preview SPA at /qa/ from mi-portafolio ${GITHUB_SHA}"
            git push origin HEAD:main
          fi
