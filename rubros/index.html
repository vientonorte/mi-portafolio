<!DOCTYPE html>
<html lang="es" data-nav="site">
  <head>
    <meta charset="UTF-8" />
    <!-- Seguridad (28-10-2026): CSP y Referrer-Policy por meta, porque GitHub Pages no permite headers.
         frame-ancestors, X-Frame-Options y HSTS NO funcionan por meta: requieren headers reales
         (proxy Cloudflare / DNS, con OK de Rö). Fuera de este cambio. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://contact.vientonorte.io https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com https://docs.google.com https://cloud.umami.is https://api-gateway.umami.dev; frame-src https://www.googletagmanager.com https://td.doubleclick.net https://embed.figma.com https://www.figma.com https://*.figma.site https://player.vimeo.com; media-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co https://docs.google.com https://contact.vientonorte.io" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Viento Norte · Rodrigo Gaete" />
<!--rubro-head-->
    <meta name="theme-color" content="#0d1b3d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050a14" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/chillax/chillax-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/chillax/chillax-700.woff2" crossorigin />
    <script>
      // Mismo tema que la home (localStorage "theme" / prefers-color-scheme), antes del primer paint.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="rubro-root" data-slug=""><!--ssr-outlet--></div>
    <script type="module" src="/src/rubros/entry-client.tsx"></script>
  </body>
</html>
