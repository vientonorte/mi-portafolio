name = "mi-portafolio-contact"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "6e96c77c41a11e043c84a7802c6108b8"
workers_dev = true

routes = [
  { pattern = "contact.vientonorte.io", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://vientonorte.io,https://www.vientonorte.io,https://vientonorte.github.io,http://localhost:3000,http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173"
CONTACT_FROM = "contacto@vientonorte.io"
CONTACT_FROM_NAME = "Viento Norte"
# Inbox privado — override con secret si prefieres: wrangler secret put CONTACT_INBOX
CONTACT_INBOX = "gaete.gaona@gmail.com"
ADMIN_GITHUB_USER = "vientonorte"
STATIC_IMAGE_BASE = "https://vientonorte.io/mi-portafolio"
WEBAUTHN_RP_ID = "vientonorte.io"
# Agenda pública de 30 min (override: wrangler secret / var)
CALENDAR_BOOKING_URL = "https://calendar.app.google/NvXgpHrpSnJ2186X7"
# R2_PUBLIC_BASE = "https://pub-xxxx.r2.dev"  # tras habilitar acceso público al bucket

GA4_MEASUREMENT_ID = "G-G7JXJKGCDV"

# Secrets (wrangler secret put):
#   CONTACT_INBOX, SESSION_SECRET, GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
#   VN_API_KEY, GITHUB_CONTENTS_TOKEN (repo contents+PR → PR desde #/admin/fotos)
#   GA4_MP_API_SECRET (Measurement Protocol · nunca en git)

[[send_email]]
name = "EMAIL"
# H1 (seguridad 2026-10-02): binding restringido. Solo puede mandar DESDE
# contacto@vientonorte.io y HACIA el inbox de VN (mismo valor que CONTACT_INBOX;
# si CONTACT_INBOX se mueve a secret con otra dirección, actualizar aquí).
# Efecto real recién al deployar. Trade-off: con esta allowlist la confirmación
# al lead (booking verificado) falla con E_RECIPIENT_NOT_ALLOWED. Opción B para
# decidir el lunes: binding aparte EMAIL_LEADS solo con allowed_sender_addresses
# (notifyVisitor ya lo usa si existe). Doc:
# https://developers.cloudflare.com/email-service/configuration/send-bindings/
allowed_destination_addresses = ["gaete.gaona@gmail.com"]
allowed_sender_addresses = ["contacto@vientonorte.io"]

[[kv_namespaces]]
binding = "ADMIN_KV"
id = "169497b8c5ee4f4eb98ee8788b8f6a82"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "mi-portafolio-images"

# Workers Logs (doc: https://developers.cloudflare.com/workers/observability/logs/workers-logs/).
# Se aplica con el deploy del lunes junto con H1 y H2. Solo en este toml, no en wrangler.contact.toml.
[observability]
enabled = true
