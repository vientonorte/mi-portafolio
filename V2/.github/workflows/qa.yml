name: QA y Accesibilidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
      - name: Lint de código
        run: npm run lint
      - name: Auditoría de seguridad
        run: npm audit --audit-level=high || true
      - name: Build y preview
        run: |
          npm run build
          npm run preview &
          sleep 5
      - name: Ejecutar axe-core
        run: npm run qa:axe
      - name: Ejecutar Lighthouse
        run: npm run qa:lighthouse
      - name: Ejecutar tests unitarios
        run: |
          if [ -f package.json ] && grep -q 'test' package.json; then
            npm test
          else
            echo 'No hay tests unitarios definidos. Agrega tests para cumplir DOD.'
          fi
      - name: Validar documentación (README y HANDOFF)
        run: |
          test -s README.md || (echo 'README.md vacío o no existe' && exit 1)
          test -s HANDOFF.md || (echo 'HANDOFF.md vacío o no existe' && exit 1)
      - name: Subir reportes como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            axe-report.json
            lighthouse-report.html