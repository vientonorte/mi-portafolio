<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viento Norte - Asistente Virtual</title>
  <!-- Import Chillax Font (300, 400, 500, 700) -->
  <link href="https://api.fontshare.com/v2/css?f[]=chillax@300,400,500,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: {
          'sm': '375px',   // mobile frame
          'md': '768px',   // tablet frame
          'lg': '1440px',  // desktop frame
        },
        fontFamily: {
          sans: ['Chillax', 'sans-serif'],
        },
        extend: {
          spacing: {
            'gutter': '24px',
            'margin-x': '64px',
            'touch': '44px', // A11Y minimum touch target
          },
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488', 
              700: '#0f766e', // Contrast with white is 4.51:1 (Passes WCAG AA)
              800: '#115e59', // Contrast with white is 6.1:1
              900: '#134e4a', // Contrast with white is 7.5:1
              950: '#042f2e', 
            }
          },
          boxShadow: {
            'soft': '0 4px 24px -4px rgba(0, 0, 0, 0.05)',
            'float': '0 8px 32px -8px rgba(0, 0, 0, 0.08)',
          }
        }
      }
    }
  </script>
  </head>
<body class="bg-gray-50 text-gray-900 antialiased h-screen overflow-hidden flex flex-col font-sans selection:bg-brand-100 selection:text-brand-900">
  <div id="root" class="flex-1 flex flex-col h-full"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
