name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    env:
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@vientonorte'
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run sync:images
      - run: npm run build

      - name: Smoke check preview artifact (domain root base /)
        run: |
          mkdir -p preview-root
          cp -R dist/. preview-root/

          python3 -m http.server 4173 --directory preview-root &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          READY=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/preview.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Preview server did not become reachable at http://127.0.0.1:4173/ within timeout." >&2
            exit 1
          fi

          grep -q '<div id="root"></div>' /tmp/preview.html

          JS_ASSET_PATH=$(grep -oE '/assets/[^"]+\.js' /tmp/preview.html | head -n 1)
          test -n "$JS_ASSET_PATH"
          curl -fsS "http://127.0.0.1:4173$JS_ASSET_PATH" >/dev/null

          CSS_ASSET_PATH=$(grep -oE '/assets/[^"]+\.css' /tmp/preview.html | head -n 1)
          test -n "$CSS_ASSET_PATH"
          curl -fsS "http://127.0.0.1:4173$CSS_ASSET_PATH" -o /tmp/preview.css
          CSS_BYTES=$(wc -c < /tmp/preview.css | tr -d ' ')
          if [ "$CSS_BYTES" -lt 50000 ]; then
            echo "CSS bundle too small (${CSS_BYTES}B) — Tailwind utilities missing" >&2
            exit 1
          fi
          grep -q '\.flex' /tmp/preview.css

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@vientonorte'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run qa:nav


  ads-query:
    name: ads-query
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ads-query
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@vientonorte'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@vientonorte'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run sync:images
      - run: npm run build
      - name: Bundle size check
        run: |
          BUNDLE=$(du -k dist/assets/*.js | sort -n | tail -1 | cut -f1)
          echo "JS bundle: ${BUNDLE}KB"
          # Budget: 650KB (gzip ~196KB) — warning si se supera
          if [ "$BUNDLE" -gt "750" ]; then
            echo "::warning::Bundle JS superó 750KB sin comprimir (${BUNDLE}KB)"
          fi

  qa-routes:
    name: QA rutas (Playwright)
    runs-on: ubuntu-latest
    needs: build
    env:
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@vientonorte'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run sync:images
      - run: npm run build
      - run: npx playwright install chromium
      - name: Servir build y validar rutas
        run: |
          mkdir -p preview-root
          cp -R dist/. preview-root/
          npx serve preview-root -l 4173 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Preview server did not become reachable." >&2
            exit 1
          fi

          node scripts/qa-routes.mjs http://127.0.0.1:4173
          node scripts/qa-prototypes.mjs http://127.0.0.1:4173

  a11y:
    name: Accesibilidad WCAG AA
    runs-on: ubuntu-latest
    needs: build
    env:
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@vientonorte'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run sync:images
      - run: npm run build
      - name: Instalar pa11y
        run: npm install -g pa11y
      - name: Servir y escanear
        run: |
          npx serve dist -p 4444 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          READY=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4444/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Preview server did not become reachable at http://127.0.0.1:4444/ within timeout." >&2
            exit 1
          fi

          # HashRouter: #/privacy no es named-anchor HTML (G1 false positive).
          # G18 residual en badges/steps del embudo home: threshold 3 mientras se endurece tokens.
          pa11y http://127.0.0.1:4444 \
            --standard WCAG2AA \
            --reporter cli \
            --ignore "WCAG2AA.Principle1.Guideline1_4.1_4_3.G18.BgImage" \
            --ignore "WCAG2AA.Principle2.Guideline2_4.2_4_1.G1,G123,G124.NoSuchID" \
            --threshold 3 \
            --config .pa11yrc.json
