<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="Rodrigo Gaete">
  <defs>
    <linearGradient id="rg" x1="8" y1="32" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF1D25"/>
      <stop offset="1" stop-color="#FF931E"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.65">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .plate { fill: #e8e5df; stroke: rgba(23,23,23,0.08); stroke-width: 1; }
      .track { stroke: #171717; stroke-opacity: 0.12; fill: none; stroke-width: 1.25; }
      @media (prefers-color-scheme: dark) {
        .plate { fill: #ebe6de; stroke: rgba(23,23,23,0.14); }
        .track { stroke: #171717; stroke-opacity: 0.14; }
      }
    </style>
  </defs>
  <circle class="plate" cx="20" cy="20" r="19"/>
  <circle class="track" cx="20" cy="20" r="13"/>
  <circle cx="20" cy="20" r="13" fill="none" stroke="url(#rg)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="56 26" transform="rotate(-108 20 20)"/>
  <circle cx="20" cy="20" r="5" fill="url(#rg)"/>
  <circle cx="20" cy="18.8" r="2.1" fill="url(#shine)"/>
</svg>