<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Chillax;
      src: url("../../../public/fonts/chillax/chillax-600.woff2") format("woff2");
      font-weight: 600;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; }
    body { background: #0A0A0A; color: #f7f2e7; font-family: Chillax, "Helvetica Neue", sans-serif; }
    .bar { height: 12px; background: linear-gradient(90deg, #F5A020, #E8401C); }
    .pad { padding: 120px 88px 100px; height: 1908px; display: flex; flex-direction: column; }
    .logo { width: 200px; height: 200px; border-radius: 24px; }
    .badge { color: #E8401C; font-size: 32px; font-weight: 600; margin-top: 80px; }
    h1 { font-size: 84px; font-weight: 600; line-height: 1.08; margin-top: 28px; color: #fff; }
    .sub { font-size: 36px; color: #c8c2b8; margin-top: 32px; line-height: 1.35; }
    .foot { margin-top: auto; }
    .cta {
      display: inline-block; background: #E8401C; color: #fff; font-size: 32px; font-weight: 600;
      padding: 24px 36px; border-radius: 12px; margin-bottom: 36px;
    }
    .url { display: block; color: #E8401C; font-size: 30px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="pad">
    <img class="logo" src="../../../public/images/branding/isologo-512.png" alt="" />
    <p class="badge">Viento Norte · pymes</p>
    <h1>Revisión gratis de un flujo</h1>
    <p class="sub">Diagnóstico UX 5–7 días.<br />WCAG 2.2 AA. Kickoff 30 min.</p>
    <div class="foot">
      <span class="cta">Agendar 30 min</span>
      <span class="url">vientonorte.io/s/consultoria</span>
    </div>
  </div>
</body>
</html>
