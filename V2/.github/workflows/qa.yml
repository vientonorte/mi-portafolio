name: QA y Accesibilidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
      - name: Build y preview
        run: |
          npm run build
          npm run preview &
          sleep 5
      - name: Ejecutar axe-core
        run: npm run qa:axe
      - name: Ejecutar Lighthouse
        run: npm run qa:lighthouse
      - name: Subir reportes como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            axe-report.json
            lighthouse-report.html
