name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Smoke check preview artifact
        run: |
          mkdir -p preview-root/mi-portafolio
          cp -R dist/. preview-root/mi-portafolio/

          python3 -m http.server 4173 --directory preview-root &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          READY=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/mi-portafolio/ > /tmp/preview.html; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "Preview server did not become reachable at http://127.0.0.1:4173/mi-portafolio/ within timeout." >&2
            exit 1
          fi

          grep -q '<div id="root"></div>' /tmp/preview.html

          JS_ASSET_PATH=$(grep -oE '/mi-portafolio/assets/[^"]+\.js' /tmp/preview.html | head -n 1)
          test -n "$JS_ASSET_PATH"
          curl -fsS "http://127.0.0.1:4173$JS_ASSET_PATH" >/dev/null

          CSS_ASSET_PATH=$(grep -oE '/mi-portafolio/assets/[^"]+\.css' /tmp/preview.html | head -n 1)
          test -n "$CSS_ASSET_PATH"
          curl -fsS "http://127.0.0.1:4173$CSS_ASSET_PATH" -o /tmp/preview.css
          CSS_BYTES=$(wc -c < /tmp/preview.css | tr -d ' ')
          if [ "$CSS_BYTES" -lt 50000 ]; then
            echo "CSS bundle too small (${CSS_BYTES}B) — Tailwind utilities missing" >&2
            exit 1
          fi
          grep -q '\.flex' /tmp/preview.css

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size check
        run: |
          BUNDLE=$(du -k dist/assets/*.js | sort -n | tail -1 | cut -f1)
          echo "JS bundle: ${BUNDLE}KB"
          # Budget: 650KB (gzip ~196KB) — warning si se supera
          if [ "$BUNDLE" -gt "750" ]; then
            echo "::warning::Bundle JS superó 750KB sin comprimir (${BUNDLE}KB)"
          fi

  a11y:
    name: Accesibilidad WCAG AA
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar pa11y
        run: npm install -g pa11y
      - name: Servir y escanear
        run: |
          npx serve dist -p 4444 &
          sleep 3
          pa11y http://localhost:4444 \
            --standard WCAG2AA \
            --reporter cli \
            --ignore "WCAG2AA.Principle1.Guideline1_4.1_4_3.G18.BgImage" \
            --threshold 0 \
            --config .pa11yrc.json
          kill %1
          kill %1
