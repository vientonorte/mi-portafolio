# Deploy solo relay de contacto (sin R2/KV admin).
# Uso: npx wrangler deploy --config wrangler.contact.toml
name = "mi-portafolio-contact"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "6e96c77c41a11e043c84a7802c6108b8"
workers_dev = true

# Canónico: contact.vientonorte.io (workers.dev fallback)
routes = [
  { pattern = "contact.vientonorte.io", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://vientonorte.io,https://www.vientonorte.io,https://vientonorte.github.io,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173"
CONTACT_FROM = "contacto@vientonorte.io"
CONTACT_FROM_NAME = "Viento Norte"
# H2 anti-bot POST /api/contact (worker/src/lib/antibot.js):
# máx. CONTACT_RATE_LIMIT envíos por IP cada CONTACT_RATE_WINDOW_SEC (429 al pasar),
# y mínimo CONTACT_MIN_FILL_MS entre formStartedAt (frontend) y el envío.
CONTACT_RATE_LIMIT = "5"
CONTACT_RATE_WINDOW_SEC = "600"
CONTACT_MIN_FILL_MS = "3000"
CONTACT_INBOX = "gaete.gaona@gmail.com"

[[send_email]]
name = "EMAIL"

# H2: KV solo para el rate limit (claves rl:contact:*). Mismo namespace que
# ADMIN_KV en wrangler.toml, pero con otro nombre de binding para que este
# deploy "solo relay" no active la persistencia de leads/admin.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "169497b8c5ee4f4eb98ee8788b8f6a82"
