name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run sync:images
      - run: npx vite build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_GOOGLE_FORM_ACTION_URL: ${{ secrets.VITE_GOOGLE_FORM_ACTION_URL }}
          VITE_GOOGLE_FORM_ENTRY_NAME: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_NAME }}
          VITE_GOOGLE_FORM_ENTRY_EMAIL: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_EMAIL }}
          VITE_GOOGLE_FORM_ENTRY_MESSAGE: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_MESSAGE }}
          VITE_GOOGLE_FORM_ENTRY_INTENT: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_INTENT }}
          VITE_GOOGLE_FORM_ENTRY_SOURCE: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_SOURCE }}
          VITE_GOOGLE_FORM_ENTRY_LANGUAGE: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_LANGUAGE }}

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
