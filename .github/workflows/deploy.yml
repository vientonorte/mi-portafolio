name: Deploy to GitHub Pages

# Gate: only after CI is green on main (no race with failing tests).
# Manual: workflow_dispatch for emergency redeploy (still runs local build steps).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  packages: read
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Fail closed if CI did not succeed (skip entirely on red CI).
  guard:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "Deploying commit from green CI: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — deploying ${{ github.ref }} @ ${{ github.sha }}"
          fi

  build-and-deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://vientonorte.io/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.ref }}
          # Historia completa: el sitemap de build usa la fecha git de cada ruta como lastmod
          # (con depth 1 todas las rutas tomarían la fecha del commit desplegado).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@vientonorte"
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - run: npm run sync:images

      # Pre-prod technical gates (mirror scripts/preprod-gate.sh L1) before ship
      - name: Preprod gate — typecheck
        run: npm run type-check

      - name: Preprod gate — unit tests
        run: npm test

      - name: Preprod gate — nav
        run: npm run qa:nav

      - name: Build SPA at domain root (base /)
        run: npx vite build
        env:
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
          VITE_GOOGLE_FORM_ACTION_URL: ${{ secrets.VITE_GOOGLE_FORM_ACTION_URL }}
          VITE_GOOGLE_FORM_ENTRY_NAME: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_NAME }}
          VITE_GOOGLE_FORM_ENTRY_EMAIL: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_EMAIL }}
          VITE_GOOGLE_FORM_ENTRY_MESSAGE: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_MESSAGE }}
          VITE_GOOGLE_FORM_ENTRY_INTENT: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_INTENT }}
          VITE_GOOGLE_FORM_ENTRY_SOURCE: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_SOURCE }}
          VITE_GOOGLE_FORM_ENTRY_LANGUAGE: ${{ secrets.VITE_GOOGLE_FORM_ENTRY_LANGUAGE }}
          VITE_A11Y_FREE_SCHEDULE_URL: ${{ secrets.VITE_A11Y_FREE_SCHEDULE_URL }}
          VITE_VIDEO_CALL_URL: ${{ secrets.VITE_VIDEO_CALL_URL }}

      - name: Guard — prod build sin MASCOTAPP (solo /qa/)
        run: bash scripts/check-prod-no-mascotapp.sh

      - name: Guard — dist sin placeholders ni enlaces a /#/news o /news/
        run: bash scripts/check-dist-no-placeholders.sh

      - name: Artifact smoke (domain root)
        env:
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q 'id="root"' dist/index.html
          if grep -qi 'mi-portafolio/assets' dist/index.html; then
            echo "Stale /mi-portafolio/assets in index" >&2
            exit 1
          fi
          JS=$(find dist/assets -name '*.js' | wc -l | tr -d ' ')
          test "$JS" -ge 1
          if [ -n "${VITE_GTM_ID:-}" ]; then
            grep -R -q -- "$VITE_GTM_ID" dist/assets || {
              echo "VITE_GTM_ID set but ID missing from bundle" >&2
              exit 1
            }
          fi

      - name: SPA fallback + legacy HTTP redirects (no hash hop)
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          mkdir -p dist/mi-portafolio dist/poc
          cp public/mi-portafolio/index.html dist/mi-portafolio/index.html
          cp public/poc/index.html dist/poc/index.html
          if grep -q 'id="root"' dist/mi-portafolio/index.html; then
            echo "dist/mi-portafolio/index.html is SPA shell" >&2
            exit 1
          fi
          if grep -q 'id="root"' dist/poc/index.html; then
            echo "dist/poc/index.html is SPA shell" >&2
            exit 1
          fi
          grep -q 'http-equiv="refresh"' dist/mi-portafolio/index.html
          grep -q 'http-equiv="refresh"' dist/poc/index.html
          # Canon 2026-09-27: /poc -> /servicios/ (sin /s/ ni hash); sin rel=alternate a /#/.
          grep -q 'location.origin + "/servicios/"' dist/index.html
          grep -q 'url=../servicios/' dist/poc/index.html
          if grep -q 'rel="alternate" href="https://vientonorte.io/#/' dist/index.html; then
            echo "index.html still has rel=alternate to a hash route" >&2
            exit 1
          fi
          if grep -q 'location.origin + "/#/consultoria"' dist/index.html; then
            echo "index.html still hops /poc to hash" >&2
            exit 1
          fi

      - name: Guard — no internal files in published dist
        run: |
          set -euo pipefail
          # /ops (incl. finanzas ledgers, passkeys notes), workers, docs, manifests and
          # repo dotfiles must never be published (Pages serves dotfiles with .nojekyll).
          # The former "Bundle /ops from hub" step copied hub ops/ into dist; removed on purpose.
          bad=0
          for p in ops workers docs data pipeline tests scripts \
                   HANDOFF.md README.md DEPLOY.md CONTRIBUTING.md CHANGELOG.md \
                   package.json package-lock.json .secrets.baseline .npmrc .env .env.example \
                   .pre-commit-config.yaml pyproject.toml requirements-dev.txt; do
            if [ -e "dist/$p" ]; then echo "INTERNAL path in dist: $p" >&2; bad=1; fi
          done
          test "$bad" -eq 0

      - name: Publish brand site to vientonorte.github.io root
        env:
          HUB_TOKEN: ${{ secrets.VN_HUB_DEPLOY_TOKEN || secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "vn-deploy"
          git config --global user.email "deploy@vientonorte.io"
          rm -rf /tmp/vn-hub-pub
          git clone --depth 1 "https://x-access-token:${HUB_TOKEN}@github.com/vientonorte/vientonorte.github.io.git" /tmp/vn-hub-pub
          cd /tmp/vn-hub-pub
          find . -maxdepth 1 -type f \( -name 'index.html' -o -name '404.html' -o -name 'sw.js' -o -name 'manifest.json' -o -name 'robots.txt' -o -name 'sitemap.xml' -o -name 'favicon.*' -o -name 'icon-*.png' -o -name 'profile-photo.jpg' -o -name 'cv-*.pdf' \) -delete || true
          rm -rf assets fonts images resources mi-portafolio 2>/dev/null || true
          # Force-remove hub orphans: /s/news and /news must not survive SPA deploy
          rm -rf s/news news
          if [ ! -d "$GITHUB_WORKSPACE/dist/images/news" ]; then
            rm -rf images/news
          fi
          # Internal files must not live in the Pages source tree (main /).
          INTERNAL="ops workers docs data pipeline tests scripts HANDOFF.md README.md DEPLOY.md CONTRIBUTING.md CHANGELOG.md package.json package-lock.json .secrets.baseline .npmrc .pre-commit-config.yaml .eslintrc.json .nvmrc .pa11yci.json pyproject.toml requirements-dev.txt"
          for p in $INTERNAL; do rm -rf "$p"; done
          cp -R "$GITHUB_WORKSPACE/dist/." .
          for p in $INTERNAL; do
            if [ -e "$p" ]; then echo "INTERNAL path survived publish: $p" >&2; exit 1; fi
          done
          # Verify orphans only exist if present in dist (they should not)
          for orphan in s/news news; do
            if [ -e "$orphan" ] && [ ! -e "$GITHUB_WORKSPACE/dist/$orphan" ]; then
              echo "ORPHAN survived publish: $orphan" >&2
              exit 1
            fi
          done
          if [ -d images/news ] && [ ! -d "$GITHUB_WORKSPACE/dist/images/news" ]; then
            echo "ORPHAN survived publish: images/news" >&2
            exit 1
          fi
          echo "vientonorte.io" > CNAME
          git add -A
          if git diff --cached --quiet; then
            echo "No hub changes"
          else
            git commit -m "deploy: Viento Norte SPA at domain root (from mi-portafolio, post-CI gate)"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
