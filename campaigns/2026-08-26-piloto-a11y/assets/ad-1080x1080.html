<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Chillax;
      src: url("../../../public/fonts/chillax/chillax-600.woff2") format("woff2");
      font-weight: 600;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; }
    body { background: #0A0A0A; color: #f7f2e7; font-family: Chillax, "Helvetica Neue", sans-serif; }
    .bar { height: 10px; background: linear-gradient(90deg, #F5A020, #E8401C); }
    .pad { padding: 72px 80px; height: 1070px; display: flex; flex-direction: column; }
    .logo { width: 160px; height: 160px; border-radius: 20px; }
    .badge { color: #E8401C; font-size: 28px; font-weight: 600; margin-top: 48px; }
    h1 { font-size: 72px; font-weight: 600; line-height: 1.08; margin-top: 20px; color: #fff; }
    .sub { font-size: 32px; color: #c8c2b8; margin-top: 24px; max-width: 900px; }
    .foot { margin-top: auto; }
    .cta {
      display: inline-block; background: #E8401C; color: #fff; font-size: 28px; font-weight: 600;
      padding: 20px 32px; border-radius: 10px; margin-bottom: 28px;
    }
    .url { display: block; color: #E8401C; font-size: 26px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="pad">
    <img class="logo" src="../../../public/images/branding/isologo-512.png" alt="" />
    <p class="badge">Viento Norte · pymes</p>
    <h1>Revisión gratis de un flujo</h1>
    <p class="sub">Diagnóstico UX · accesibilidad WCAG 2.2 AA. Precio en la llamada.</p>
    <div class="foot">
      <span class="cta">Agendar 30 min</span>
      <span class="url">vientonorte.io/s/consultoria</span>
    </div>
  </div>
</body>
</html>
