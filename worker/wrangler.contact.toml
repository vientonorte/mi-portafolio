# Deploy solo relay de contacto (sin R2/KV admin).
# Uso: npx wrangler deploy --config wrangler.contact.toml
name = "mi-portafolio-contact"
main = "src/index.js"
compatibility_date = "2024-09-23"
account_id = "6e96c77c41a11e043c84a7802c6108b8"
workers_dev = true

# Canónico: contact.vientonorte.io (workers.dev fallback)
routes = [
  { pattern = "contact.vientonorte.io", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://vientonorte.io,https://www.vientonorte.io,https://vientonorte.github.io,http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173"
CONTACT_FROM = "contacto@vientonorte.io"
CONTACT_FROM_NAME = "Viento Norte"
CONTACT_INBOX = "gaete.gaona@gmail.com"

[[send_email]]
name = "EMAIL"
# H1 (seguridad 2026-10-02): binding restringido. Solo puede mandar DESDE
# contacto@vientonorte.io y HACIA el inbox de VN (mismo valor que CONTACT_INBOX;
# si CONTACT_INBOX se mueve a secret con otra dirección, actualizar aquí).
# Efecto real recién al deployar. Trade-off: con esta allowlist la confirmación
# al lead (booking verificado) falla con E_RECIPIENT_NOT_ALLOWED. Opción B para
# decidir el lunes: binding aparte EMAIL_LEADS solo con allowed_sender_addresses
# (notifyVisitor ya lo usa si existe). Doc:
# https://developers.cloudflare.com/email-service/configuration/send-bindings/
allowed_destination_addresses = ["gaete.gaona@gmail.com"]
allowed_sender_addresses = ["contacto@vientonorte.io"]